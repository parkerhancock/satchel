name: Feature Request
description: Suggest a target, component, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow should Satchel make simpler?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Design
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Cross-target
        - Codex
        - Claude
        - GitHub Copilot
        - Antigravity
        - Other

