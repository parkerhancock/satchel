name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Verify release tag matches package version
        run: |
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/generate_schema_docs.py --check
      - run: git diff --check
      - run: uv run satchel check . --release
      - run: uv run satchel check . --host
      - run: uv run satchel smoke . --host
      - run: uv run satchel pack . --target codex --release --output-dir /tmp/satchel-target-packs
      - run: uv run satchel pack . --target claude --release --output-dir /tmp/satchel-target-packs
      - run: uv run satchel pack . --target copilot --release --output-dir /tmp/satchel-target-packs
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
