name: Standards Watch

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --dev

      - id: standards
        run: |
          set +e
          uv run satchel standards check . --update --json > standards-report.json
          status=$?
          cat standards-report.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Open or update standards issue
        if: steps.standards.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create standards-watch \
            --color C2E0C6 \
            --description "Upstream plugin standard changes" || true
          body="$(mktemp)"
          {
            echo "Satchel standards watch detected upstream documentation changes."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Review the changed sources, update adapters or docs if needed, then refresh committed snapshots."
            echo "After reviewing the issue, run the Standards Claude PR workflow manually with this issue number."
            echo
            echo '```json'
            cat standards-report.json
            echo '```'
          } > "$body"

          existing="$(
            gh issue list \
              --state open \
              --label standards-watch \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create \
              --title "Standards watch detected upstream changes" \
              --label standards-watch \
              --body-file "$body"
          fi
