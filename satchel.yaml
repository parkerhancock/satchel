schema: satchel/v0
name: satchel
version: 0.4.0
description: Build agent plugin manifests from one product-agnostic source package.
author:
  name: Parker Hancock
  url: https://github.com/parkerhancock
homepage: https://github.com/parkerhancock/satchel
repository: https://github.com/parkerhancock/satchel
license: MIT
keywords:
  - agents
  - plugins
  - codex
  - claude
  - copilot
  - chatgpt
  - anthropic
  - cowork
  - antigravity
  - skills
  - mcp

components:
  skills:
    path: ./skills

targets:
  codex:
    enabled: true
    manifest: ./.codex-plugin/plugin.json
    marketplace:
      path: ./.agents/plugins/marketplace.json
      name: satchel-marketplace
      displayName: Satchel
      source:
        source: url
        url: https://github.com/parkerhancock/satchel.git
        ref: main
      category: Productivity
      installation: AVAILABLE
      authentication: ON_INSTALL
    interface:
      displayName: Satchel
      shortDescription: Build agent plugins from one source package.
      longDescription: Product-agnostic authoring tools for agent extensions. Satchel keeps satchel.yaml as the source of truth, then generates host-specific plugin files and checks generated-file drift.
      category: Productivity
      capabilities:
        - Read
        - Write
      websiteURL: https://github.com/parkerhancock/satchel
      defaultPrompt:
        - Use Satchel to add or validate a product-agnostic agent plugin package.
      brandColor: "#e5a82f"
      logo: ./assets/logo.svg
      composerIcon: ./assets/logo.svg
      screenshots:
        - ./assets/cover.svg

  claude:
    enabled: true
    manifest: ./.claude-plugin/plugin.json
    marketplace:
      path: ./.claude-plugin/marketplace.json
      name: satchel-marketplace
      source:
        source: github
        repo: parkerhancock/satchel
        ref: main
      category: Productivity
    displayName: Satchel

  copilot:
    enabled: true
    manifest: ./.github/plugin/plugin.json
    marketplace:
      path: ./.github/plugin/marketplace.json
      name: satchel-marketplace
      source:
        source: github
        repo: parkerhancock/satchel
        ref: main
      category: Productivity

  antigravity:
    enabled: true
    experimental: true
    output: ./.agents/plugins/satchel

  cowork:
    enabled: true
    manifest: ./cowork/manifest.json
    displayName: Satchel
    developer:
      name: Parker Hancock
      websiteUrl: https://github.com/parkerhancock/satchel
      privacyUrl: https://github.com/parkerhancock/satchel/blob/main/PRIVACY.md
      termsOfUseUrl: https://github.com/parkerhancock/satchel/blob/main/LICENSE
    icons:
      outline: ./assets/cowork-outline.png
      color: ./assets/cowork-color.png
    accentColor: "#e5a82f"

  chatgpt:
    enabled: false
    notApplicable: Satchel has no remote MCP service; use the Codex plugin for repository-backed Satchel workflows.

  anthropic:
    enabled: false
    notApplicable: Satchel has no remote MCP service; use the Claude Code plugin for repository-backed Satchel workflows.
