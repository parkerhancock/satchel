schema: satchel/v0
name: fixture-skills-and-mcp
version: 0.1.0
description: Fixture with portable skills and MCP configuration.
author:
  name: Satchel Fixtures
components:
  skills:
    path: ./skills
  mcp:
    path: ./.mcp.json
targets:
  codex:
    enabled: true
    manifest: ./.codex-plugin/plugin.json
  claude:
    enabled: true
    manifest: ./.claude-plugin/plugin.json
  copilot:
    enabled: true
    manifest: ./.github/plugin/plugin.json

