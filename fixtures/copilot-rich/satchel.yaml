schema: satchel/v0
name: fixture-copilot-rich
version: 0.1.0
description: Fixture covering GitHub Copilot package metadata.
author:
  name: Satchel Fixtures
components:
  skills:
    path: ./skills
  mcp:
    path: ./.mcp.json
  hooks:
    path: ./hooks/hooks.json
  agents:
    path: ./agents
  commands:
    path: ./commands
  lsp:
    path: ./lsp.json
targets:
  codex:
    enabled: false
  claude:
    enabled: false
  copilot:
    enabled: true
    manifest: ./.github/plugin/plugin.json
    rootManifest: ./plugin.json
    category: Productivity
    tags:
      - fixtures
      - satchel
    marketplace:
      path: ./.github/plugin/marketplace.json
      name: fixture-copilot-rich-marketplace
      source:
        source: github
        repo: example/fixture-copilot-rich
